<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <link rel ="stylesheet" href="../Css/global.css">
     <link rel="stylesheet" href="../Css/component.css">
    <link rel ="stylesheet" href="../Css/newEntry.css">
    
    <script src="https://kit.fontawesome.com/bd68228cee.js" crossorigin="anonymous"></script>
    <title>New Entry</title>
     
</head>
<body >
    <main id="rootOne"></main>       


    <div id="reflectionTitle">
        <h2 id="date"></h2>
        <input type="text" 
                id="entryTitle"
                placeholder="Untitled Reflection"
                size="50"
                >
    
        <ul>
            <li><button id="thoughtfulButton" class="allButtons"> <i class="fa-solid fa-face-smile"></i> Thoughtful</button> </li>
            <li><button id="tagButton" class="allButtons"><i class="fa-solid fa-plus"></i> Add Tag </button> </li>
        </ul> 
</div>

<div id="tagRoot"></div>

    <form method="POST" action="?">
        <!-- what would be the value of action here? should it be the server? is this where API Local Storage comes in? i think for now its local storage -->

        <textarea id="textarea"
         placeholder="Begin your reflection..." 
         name="reflection Body"
         cols="90"
         rows="30"
        ></textarea>
    

</form>

<div id="saveEntryMenu">
    <ul>
        <li><button id="insertMemory"><i class="fa-solid fa-image"></i> Insert Memory</button></li>
        <li><button id="private"><i class="fa-solid fa-lock"></i> Private</button></li>
        <li><button id="discard">Discard</button></li>
        <li><button id="save">Save Entry</button></li>
    </ul>
</div>


    <footer id="footer"></footer>

    <script src="../Scripts/navData.js"></script>
    <script src="../Scripts/cardData.js"></script>
    <script src="../Scripts/newEntry.js"></script>
    <script src="../Scripts/global.js"></script>
    
</body>
</html>
